<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} - ZeroNet</title>
  <style>
    /* .left-drawer* rules kept in sync with plugins/Sidebar/media/all.css --
       not linked directly (that stylesheet's own bare `body{overflow:hidden;
       height:100%}` etc are written for the full-viewport wrapper shell and
       would break this page's own scrolling), just the drawer itself, which
       has no dependency on anything else in that file. */
    .left-drawer {
      position: fixed; top: 0; left: -300px; width: 300px; height: 100%;
      background-color: #1B1B1D; color: #DDD; z-index: 1000;
      transition: left 0.25s cubic-bezier(.2,.8,.3,1); box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      font-family: 'Lucida Grande', 'Segoe UI', Helvetica, Arial, sans-serif; -webkit-user-drag: none;
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-direction: column;
    }
    .left-drawer.dragging { transition: none; }
    .left-drawer.open { left: 0; }
    .left-drawer-tab {
      position: absolute; top: 50%; right: -30px; transform: translateY(-50%);
      width: 30px; height: 64px; background-color: #1B1B1D; color: #888;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      border-radius: 0 8px 8px 0; box-shadow: 3px 0 8px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06); border-left: none;
      -webkit-user-select: none; user-select: none; -webkit-user-drag: none; font-size: 20px;
      transition: color 0.15s, background-color 0.15s;
    }
    .left-drawer-tab:hover { color: #fff; background-color: #262628; }
    .left-drawer.open .left-drawer-tab { transform: translateY(-50%) rotateY(180deg); }
    .left-drawer-head {
      flex: 0 0 auto; padding: 18px 20px; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase;
      color: #888; border-bottom: 1px solid rgba(255,255,255,0.07);
      background: linear-gradient(135deg, rgba(175,59,255,0.12), transparent 60%);
    }
    .left-drawer-head b { color: #DDD; font-weight: 600; }
    .left-drawer-content {
      flex: 1 1 auto; padding: 8px 20px 24px; overflow-y: auto; box-sizing: border-box; min-height: 0;
      scrollbar-width: thin; scrollbar-color: #4A4A4E transparent;
    }
    .left-drawer-content::-webkit-scrollbar { width: 8px; }
    .left-drawer-content::-webkit-scrollbar-track { background: transparent; }
    .left-drawer-content::-webkit-scrollbar-thumb { background-color: #45454A; border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
    .left-drawer-content::-webkit-scrollbar-thumb:hover { background-color: #AF3BFF; background-clip: padding-box; }
    .left-drawer h2 { font-weight: 600; font-size: 11px; text-transform: uppercase; color: #7A7A80; margin: 22px 0 6px; letter-spacing: 1.5px; }
    .left-drawer h2:first-child { margin-top: 16px; }
    .left-drawer #leftdrawer-home { margin-bottom: 6px; padding-bottom: 9px; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .left-drawer a.item {
      display: block; color: #DDD; text-decoration: none; padding: 9px 10px; margin: 0 -10px;
      border-radius: 5px; font-size: 13.5px; transition: background-color 0.15s, color 0.15s, padding-left 0.15s;
      border-left: 2px solid transparent;
    }
    .left-drawer a.item:hover { color: #fff; background-color: rgba(175,59,255,0.12); border-left-color: #AF3BFF; padding-left: 14px; }
    .left-drawer a.item.danger { color: #E0736B; }
    .left-drawer a.item.danger:hover { background-color: rgba(224,91,91,0.12); border-left-color: #E0736B; color: #FF8A82; }
    .left-drawer .theme-row, .left-drawer .lang-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 0 16px; }
    .left-drawer .theme-row a, .left-drawer .lang-row a {
      color: #999; text-decoration: none; padding: 4px 10px; border: 1px solid rgba(255,255,255,0.09);
      background-color: rgba(255,255,255,0.03); border-radius: 4px; font-size: 11.5px; text-transform: uppercase;
      letter-spacing: 0.5px; transition: all 0.15s;
    }
    .left-drawer .theme-row a:hover, .left-drawer .lang-row a:hover { color: #fff; border-color: #666; }
    .left-drawer .theme-row a.selected, .left-drawer .lang-row a.selected {
      color: white; border-color: #AF3BFF; background-color: rgba(175,59,255,0.25);
      box-shadow: 0 0 0 1px rgba(175,59,255,0.4);
    }
    .left-drawer .version { color: #666; font-size: 11px; margin: 22px 0 6px; letter-spacing: 0.3px; }
    :root { color-scheme: light dark; }
    body { font: 15px/1.45 system-ui, sans-serif; margin: 0; padding: 2rem; background: #f5f5f5; color: #222; }
    main { max-width: 1000px; margin: auto; background: white; padding: 1.5rem 2rem; border-radius: 8px; box-shadow: 0 2px 12px #0002; }
    nav { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    nav a { color: #1769aa; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .55rem; border-bottom: 1px solid #ddd; vertical-align: top; }
    th { background: #eee; }
    input[type=text] { width: min(100%, 30rem); padding: .35rem; }
    button { padding: .4rem .8rem; cursor: pointer; }
    .muted { color: #666; }
    .pending { color: #a65d00; }
    #status { min-height: 1.5em; margin: 1rem 0; }
    @media (prefers-color-scheme: dark) {
      body { background: #202124; color: #eee; } main { background: #292a2d; }
      th { background: #3a3b3e; } th, td { border-color: #555; } .muted { color: #bbb; }
    }
  </style>
</head>
<body>
{% include "left_drawer.html" %}
<main>
  <nav>
    <a href="/Config">Configuration</a>
    <a href="/Plugins">Plugins</a>
    <a href="/SiteBuilder">New site</a>
    <a href="/ContentFilter">Content filters</a>
    {% if address %}<a href="/list/{{ address }}">Files</a>{% endif %}
    <a href="/Console">Console</a>
  </nav>
  <h1>{{ title }}</h1>
  <p id="status" class="muted">Loading…</p>
  <section id="content"></section>
</main>
<script>
(() => {
  const page = {{ page | tojson }};
  const socketUrl = {{ websocket_url | tojson }};
  const status = document.getElementById("status");
  const content = document.getElementById("content");
  let socket, nextId = 1, pending = new Map();

  function call(cmd, params = {}) {
    return new Promise((resolve, reject) => {
      const id = nextId++;
      pending.set(id, {resolve, reject});
      socket.send(JSON.stringify({cmd, params, id}));
    });
  }

  function esc(value) {
    const node = document.createElement("span");
    node.textContent = String(value ?? "");
    return node.innerHTML;
  }

  function renderConfig(values) {
    const rows = Object.entries(values).sort(([a], [b]) => a.localeCompare(b)).map(([key, item]) => {
      const value = item.value;
      const encoded = typeof value === "object" ? JSON.stringify(value) : String(value ?? "");
      return `<tr><td><code>${esc(key)}</code></td><td><input type="text" data-key="${esc(key)}" value="${esc(encoded)}"></td>` +
        `<td class="muted">${esc(item.default)}</td><td>${item.pending ? '<span class="pending">restart required</span>' : ''}</td>` +
        `<td><button data-save="${esc(key)}">Save</button></td></tr>`;
    }).join("");
    content.innerHTML = `<table><thead><tr><th>Key</th><th>Value</th><th>Default</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
    content.querySelectorAll("button[data-save]").forEach(button => button.onclick = async () => {
      const key = button.dataset.save;
      const input = content.querySelector(`input[data-key="${CSS.escape(key)}"]`);
      let value = input.value;
      try { value = JSON.parse(value); } catch (_) { /* plain strings are valid config values */ }
      try { await call("configSet", {key, value}); status.textContent = `${key} saved.`; load(); }
      catch (error) { status.textContent = error.message; }
    });
  }

  function renderPlugins(data) {
    const rows = data.plugins.sort((a, b) => a.name.localeCompare(b.name)).map(plugin =>
      `<tr><td><code>${esc(plugin.name)}</code></td><td>${plugin.loaded ? "loaded" : "not loaded"}</td>` +
      `<td><label><input type="checkbox" data-plugin="${esc(plugin.dir_name)}" ${plugin.enabled ? "checked" : ""}> enabled</label></td></tr>`
    ).join("");
    content.innerHTML = `<p class="muted">Changes take effect after restarting the native P2P process.</p>` +
      `<table><thead><tr><th>Plugin</th><th>State</th><th>Enabled</th></tr></thead><tbody>${rows}</tbody></table>`;
    content.querySelectorAll("input[data-plugin]").forEach(input => input.onchange = async () => {
      try { await call("pluginConfigSet", {dir_name: input.dataset.plugin, key: "enabled", value: input.checked}); status.textContent = "Plugin setting saved."; }
      catch (error) { input.checked = !input.checked; status.textContent = error.message; }
    });
  }

  function renderSiteBuilder(starters) {
    const cards = starters.map(starter =>
      `<tr><td><code>${esc(starter.id)}</code></td><td>${esc(starter.title)}</td>` +
      `<td class="muted">${esc(starter.description)}</td>` +
      `<td><button data-starter="${esc(starter.id)}">Create</button></td></tr>`
    ).join("");
    content.innerHTML = `<p class="muted">Creates a new site signed with your own key, seeded from the chosen starter template.</p>` +
      `<table><thead><tr><th>Starter</th><th>Title</th><th>Description</th><th></th></tr></thead><tbody>${cards}</tbody></table>`;
    content.querySelectorAll("button[data-starter]").forEach(button => button.onclick = async () => {
      const buttons = content.querySelectorAll("button[data-starter]");
      buttons.forEach(b => b.disabled = true);
      status.textContent = "Creating site…";
      try {
        const result = await call("siteBuilderCreate", {starter: button.dataset.starter});
        status.innerHTML = `Site created: <a href="/${esc(result.address)}/">${esc(result.address)}</a>`;
      } catch (error) {
        status.textContent = error.message;
      } finally {
        buttons.forEach(b => b.disabled = false);
      }
    });
  }

  function renderContentFilter(siteblocks, mutes) {
    const blockRows = Object.entries(siteblocks).sort(([a], [b]) => a.localeCompare(b)).map(([address, info]) =>
      `<tr><td><code>${esc(address)}</code></td><td>${esc(info.reason ?? "")}</td>` +
      `<td><button data-unblock="${esc(address)}">Remove</button></td></tr>`
    ).join("");
    const muteRows = Object.entries(mutes).sort(([a], [b]) => a.localeCompare(b)).map(([auth_address, info]) =>
      `<tr><td><code>${esc(auth_address)}</code></td><td>${esc(info.cert_user_id ?? "")}</td><td>${esc(info.reason ?? "")}</td>` +
      `<td><button data-unmute="${esc(auth_address)}">Remove</button></td></tr>`
    ).join("");
    content.innerHTML =
      `<h2>Blocked sites</h2>` +
      (blockRows
        ? `<table><thead><tr><th>Address</th><th>Reason</th><th></th></tr></thead><tbody>${blockRows}</tbody></table>`
        : `<p class="muted">No blocked sites.</p>`) +
      `<h2>Muted users</h2>` +
      (muteRows
        ? `<table><thead><tr><th>Auth address</th><th>Cert user id</th><th>Reason</th><th></th></tr></thead><tbody>${muteRows}</tbody></table>`
        : `<p class="muted">No muted users.</p>`);
    content.querySelectorAll("button[data-unblock]").forEach(button => button.onclick = async () => {
      try { await call("siteblockRemove", {site_address: button.dataset.unblock}); status.textContent = "Site unblocked."; load(); }
      catch (error) { status.textContent = error.message; }
    });
    content.querySelectorAll("button[data-unmute]").forEach(button => button.onclick = async () => {
      try { await call("muteRemove", {auth_address: button.dataset.unmute}); status.textContent = "User unmuted."; load(); }
      catch (error) { status.textContent = error.message; }
    });
  }

  const PAGE_LOADERS = {
    config: async () => renderConfig(await call("configList")),
    plugins: async () => renderPlugins(await call("pluginList")),
    sitebuilder: async () => renderSiteBuilder(await call("siteBuilderStarters")),
    contentfilter: async () => renderContentFilter(await call("siteblockList"), await call("muteList")),
  };

  async function load() {
    try {
      await PAGE_LOADERS[page]();
      status.textContent = "";
    } catch (error) { status.textContent = error.message; }
  }

  // Left drawer -- plain JS (no jQuery here, unlike the wrapper pages'
  // LeftDrawer in plugins/Sidebar/media/all.js) bound onto the same
  // server-rendered markup (templates/left_drawer.html) so it persists
  // onto this admin page too, not just site views. Reuses this page's
  // own call() websocket helper instead of wrapper.ws.cmd.
  const drawer = document.getElementById("left-drawer");
  const drawerTab = document.getElementById("left-drawer-tab");
  const drawerWidth = 300;
  let drawerOpened = false;

  function drawerOpen() {
    drawerOpened = true;
    drawer.classList.add("open");
    refreshDrawerInfo();
  }
  function drawerClose() {
    drawerOpened = false;
    drawer.classList.remove("open");
  }
  function drawerToggle() { drawerOpened ? drawerClose() : drawerOpen(); }

  async function refreshDrawerInfo() {
    const server_info = await call("serverInfo");
    document.getElementById("leftdrawer-version").textContent =
      `Version ${server_info.version} (rev${server_info.rev})`;
    const theme_selected = (server_info.user_settings && server_info.user_settings.use_system_theme)
      ? "system" : ((server_info.user_settings && server_info.user_settings.theme) || "system");
    drawer.querySelectorAll(".theme-option").forEach(a => a.classList.toggle("selected", a.dataset.theme === theme_selected));
    const lang_selected = server_info.language || "en";
    drawer.querySelectorAll(".lang-option").forEach(a => a.classList.toggle("selected", a.dataset.lang === lang_selected));
  }

  let dragMoved = false, dragStartX = 0, dragOpenedAtStart = false;
  drawerTab.addEventListener("dragstart", e => e.preventDefault());
  drawerTab.addEventListener("click", e => {
    e.preventDefault();
    // See LeftDrawer's own note in plugins/Sidebar/media/all.js: mousedown
    // fires before every click, so gating on elapsed time never actually
    // let a plain click toggle. Track real pointer movement instead.
    if (dragMoved) return;
    drawerToggle();
  });
  drawerTab.addEventListener("mousedown", e => {
    if (e.button > 0) return;
    dragStartX = e.pageX;
    dragOpenedAtStart = drawerOpened;
    dragMoved = false;
    drawer.classList.add("dragging");
    const onMove = e => {
      const dx = e.pageX - dragStartX;
      if (Math.abs(dx) > 5) dragMoved = true;
      let targetx = (dragOpenedAtStart ? 0 : -drawerWidth) + dx;
      targetx = Math.max(-drawerWidth, Math.min(0, targetx));
      drawer.style.left = targetx + "px";
    };
    const onUp = () => {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      drawer.classList.remove("dragging");
      if (!dragMoved) { drawer.style.left = ""; return; }
      const left = parseInt(drawer.style.left) || 0;
      drawer.style.left = "";
      left > -drawerWidth / 2 ? drawerOpen() : drawerClose();
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });

  document.getElementById("leftdrawer-back").onclick = e => { e.preventDefault(); history.back(); };
  document.getElementById("leftdrawer-home").onclick = e => { e.preventDefault(); location.href = "/"; };
  document.getElementById("leftdrawer-newsite-blank").onclick = async e => {
    e.preventDefault();
    const result = await call("siteCreate");
    if (result && result.address) location.href = `/${result.address}/`;
  };
  document.getElementById("leftdrawer-siteupdateall").onclick = async e => {
    e.preventDefault();
    const result = await call("siteUpdateAll");
    status.textContent = `Updated ${result && result.updated ? result.updated.length : 0} site(s)`;
  };
  document.getElementById("leftdrawer-showdir").onclick = async e => {
    e.preventDefault();
    const result = await call("serverShowdirectory", {directory: "backup"});
    if (result && result.path) status.textContent = `Data directory: ${result.path}`;
  };
  document.getElementById("leftdrawer-shutdown").onclick = e => {
    e.preventDefault();
    if (confirm("Shut down ZeroNet?")) call("serverShutdown");
  };
  drawer.querySelectorAll(".theme-option").forEach(a => a.onclick = async e => {
    e.preventDefault();
    const theme = a.dataset.theme;
    const user_settings = (await call("userGetGlobalSettings")) || {};
    let applied_theme;
    if (theme === "system") {
      applied_theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      user_settings.use_system_theme = true;
    } else {
      applied_theme = theme;
      user_settings.use_system_theme = false;
    }
    user_settings.theme = applied_theme;
    await call("userSetGlobalSettings", {settings: user_settings});
    refreshDrawerInfo();
  });
  drawer.querySelectorAll(".lang-option").forEach(a => a.onclick = async e => {
    e.preventDefault();
    await call("configSet", {key: "language", value: a.dataset.lang});
    location.reload();
  });

  socket = new WebSocket(socketUrl);
  socket.onopen = load;
  socket.onmessage = event => {
    const message = JSON.parse(event.data);
    const request = pending.get(message.to);
    if (!request) return;
    pending.delete(message.to);
    if (message.error) request.reject(new Error(message.error)); else request.resolve(message.result);
  };
  socket.onerror = () => { status.textContent = "Could not connect to the native UI websocket."; };
})();
</script>
</body>
</html>
