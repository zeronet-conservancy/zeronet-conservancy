name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 16
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Prepare for installation
      run: |
        python3 -m pip install setuptools
        python3 -m pip install --upgrade pip wheel
        python3 -m pip install --upgrade codecov coveralls flake8 mock "pytest<8" pytest-cov selenium

    - name: Install
      run: |
        python3 -m pip install --upgrade -r requirements.txt
        python3 -m pip list

    - name: Prepare for tests
      run: |
        openssl version -a
        echo 0 | sudo tee /proc/sys/net/ipv6/conf/all/disable_ipv6

    - name: Test
      run: |
        mkdir -p log
        python3 -m pytest src/Test --cov=src --cov-config src/Test/coverage.ini
        export ZERONET_LOG_DIR="log/CryptMessage"; python3 -m pytest -x plugins/CryptMessage/Test
        export ZERONET_LOG_DIR="log/Bigfile"; python3 -m pytest -x plugins/Bigfile/Test
        export ZERONET_LOG_DIR="log/AnnounceLocal"; python3 -m pytest -x plugins/AnnounceLocal/Test
        export ZERONET_LOG_DIR="log/OptionalManager"; python3 -m pytest -x plugins/OptionalManager/Test
        export ZERONET_LOG_DIR="log/Multiuser"; mv plugins/disabled-Multiuser plugins/Multiuser && python3 -m pytest -x plugins/Multiuser/Test
        export ZERONET_LOG_DIR="log/Bootstrapper"; mv plugins/disabled-Bootstrapper plugins/Bootstrapper && python3 -m pytest -x plugins/Bootstrapper/Test
        find src -name "*.json" | xargs -n 1 python3 -c "import json, sys; print(sys.argv[1], end=' '); json.load(open(sys.argv[1])); print('[OK]')"
        find plugins -name "*.json" | xargs -n 1 python3 -c "import json, sys; print(sys.argv[1], end=' '); json.load(open(sys.argv[1])); print('[OK]')"
        flake8 . --count --select=E9,F63,F72,F82 --show-source --statistics --exclude=src/lib/pyaes/
